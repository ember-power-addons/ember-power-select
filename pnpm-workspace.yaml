allowBuilds:
  '@parcel/watcher': true
  core-js: false
  esbuild: false

# Docs: https://pnpm.io/settings
# https://github.com/emberjs/rfcs/pull/907

# we don't want addons to be bad citizens of the ecosystem
autoInstallPeers: false

# we want true isolation,
# if a dependency is not declared, we want an error
resolvePeersFromWorkspaceRoot: false

packages:
  - .
  - docs

minimumReleaseAgeExclude:
  - ember-basic-dropdown@9.0.1
  - sass-embedded-all-unknown@1.108.0
  - sass-embedded-android-arm64@1.108.0
  - sass-embedded-android-arm@1.108.0
  - sass-embedded-android-riscv64@1.108.0
  - sass-embedded-android-x64@1.108.0
  - sass-embedded-darwin-arm64@1.108.0
  - sass-embedded-darwin-x64@1.108.0
  - sass-embedded-linux-arm64@1.108.0
  - sass-embedded-linux-arm@1.108.0
  - sass-embedded-linux-musl-arm64@1.108.0
  - sass-embedded-linux-musl-arm@1.108.0
  - sass-embedded-linux-musl-riscv64@1.108.0
  - sass-embedded-linux-musl-x64@1.108.0
  - sass-embedded-linux-riscv64@1.108.0
  - sass-embedded-linux-x64@1.108.0
  - sass-embedded-unknown-all@1.108.0
  - sass-embedded-win32-arm64@1.108.0
  - sass-embedded-win32-x64@1.108.0
  - sass-embedded@1.108.0
  - sass@1.108.0
